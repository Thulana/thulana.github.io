<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 600" width="2400" height="600" role="img" aria-label="Abstract network of connected nodes">
  <title>Connected nodes</title>
  <style>
    :root { color-scheme: light dark; }
    .bg-a { stop-color: #1b2a33; }
    .bg-b { stop-color: #0f1418; }
    .edge { stroke: #2f6f8f; stroke-width: 1.4; opacity: .45; }
    .edge-dim { stroke: #3b4a54; stroke-width: 1; opacity: .35; }
    .node { fill: #7cc3e0; }
    .node-dim { fill: #55707f; }
    .glow { fill: #007cae; opacity: .16; }
    @media (prefers-color-scheme: light) {
      .bg-a { stop-color: #33566b; }
      .bg-b { stop-color: #1d2f3c; }
      .edge { stroke: #8fd0e8; opacity: .5; }
      .edge-dim { stroke: #7d97a6; opacity: .4; }
      .node { fill: #d8f0fa; }
      .node-dim { fill: #9fc0d0; }
      .glow { fill: #6fb7d6; opacity: .18; }
    }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg-a"/>
      <stop offset="1" class="bg-b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" class="glow"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2400" height="600" fill="url(#sky)"/>
  <ellipse cx="640" cy="250" rx="760" ry="420" fill="url(#halo)"/>
  <ellipse cx="1900" cy="420" rx="620" ry="360" fill="url(#halo)"/>

  <g class="edge-dim" fill="none">
    <path d="M120 470 L330 300 L560 380 L690 180 L900 260"/>
    <path d="M900 260 L1120 130 L1360 240 L1580 150"/>
    <path d="M1580 150 L1810 300 L2050 210 L2280 330"/>
    <path d="M330 300 L500 520 L760 470 L1010 540"/>
    <path d="M1010 540 L1280 430 L1520 500 L1760 440"/>
    <path d="M1760 440 L2010 520 L2280 330"/>
  </g>

  <g class="edge" fill="none">
    <path d="M560 380 L690 180"/>
    <path d="M1120 130 L1360 240"/>
    <path d="M1280 430 L1360 240"/>
    <path d="M1810 300 L2050 210"/>
    <path d="M760 470 L900 260"/>
  </g>

  <g class="node-dim">
    <circle cx="120" cy="470" r="4"/><circle cx="500" cy="520" r="4"/>
    <circle cx="1010" cy="540" r="4"/><circle cx="1520" cy="500" r="4"/>
    <circle cx="2010" cy="520" r="4"/><circle cx="2280" cy="330" r="4"/>
    <circle cx="330" cy="300" r="4"/><circle cx="1580" cy="150" r="4"/>
  </g>

  <g class="node">
    <circle cx="690" cy="180" r="7"/>
    <circle cx="900" cy="260" r="6"/>
    <circle cx="1120" cy="130" r="7"/>
    <circle cx="1360" cy="240" r="8"/>
    <circle cx="1810" cy="300" r="6"/>
    <circle cx="560" cy="380" r="5"/>
    <circle cx="1280" cy="430" r="5"/>
    <circle cx="760" cy="470" r="5"/>
    <circle cx="2050" cy="210" r="5"/>
    <circle cx="1760" cy="440" r="5"/>
  </g>
</svg>
