<script>
  // Theme toggle. The stored value is the reader's explicit choice; with nothing
  // stored the OS preference applies via prefers-color-scheme in the stylesheet.
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var root = document.documentElement;
    var label = btn.querySelector('.theme-toggle__label');
    var icon = btn.querySelector('i');
    var media = window.matchMedia('(prefers-color-scheme: dark)');

    function currentlyDark() {
      var attr = root.getAttribute('data-theme');
      if (attr === 'dark') return true;
      if (attr === 'light') return false;
      return media.matches;
    }

    function sync() {
      var dark = currentlyDark();
      if (label) label.textContent = dark ? 'Light' : 'Dark';
      if (icon) icon.className = dark ? 'fa fa-sun-o' : 'fa fa-moon-o';
      btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    }

    btn.addEventListener('click', function () {
      var next = currentlyDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) { /* storage blocked */ }
      sync();
    });

    // Follow the OS while the reader has not chosen for themselves.
    media.addEventListener('change', function () {
      if (!root.getAttribute('data-theme')) sync();
    });

    sync();
  })();
</script>
