<div class="ct-topbar">
  <div class="container">
    <ul class="list-unstyled list-inline ct-topbar__list">
      <li class="ct-language">
        <button type="button" class="ct-language__toggle" aria-expanded="false" aria-controls="ct-language-menu">
          Language <i class="fa fa-arrow-down" aria-hidden="true"></i>
        </button>
        <ul class="list-unstyled ct-language__dropdown" id="ct-language-menu">
          <li><a href="#googtrans(en|en)" class="lang-select" data-lang="en" lang="en"><img src="/images/eng-icon.png" alt="Read this site in English" width="16" height="9"></a></li>
          <li><a href="#googtrans(en|si)" class="lang-select" data-lang="si" lang="si"><img src="/images/si-icon.png" alt="Read this site in Sinhala" width="16" height="8"></a></li>
        </ul>
      </li>
    </ul>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme" title="Switch theme">
      <i class="fa fa-moon-o" aria-hidden="true"></i><span class="theme-toggle__label">Dark</span>
    </button>
  </div>
</div>

<div id="google_translate_element" hidden></div>

<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      { pageLanguage: 'en', layout: google.translate.TranslateElement.FloatPosition.TOP_LEFT },
      'google_translate_element'
    );
  }

  (function () {
    // Keyboard/touch toggle for the dropdown; CSS still handles :hover on pointer devices.
    var toggle = document.querySelector('.ct-language__toggle');
    var menu = document.getElementById('ct-language-menu');
    if (toggle && menu) {
      toggle.addEventListener('click', function () {
        var open = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!open));
        menu.classList.toggle('is-open', !open);
      });
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.ct-language')) {
          toggle.setAttribute('aria-expanded', 'false');
          menu.classList.remove('is-open');
        }
      });
    }

    document.querySelectorAll('.lang-select').forEach(function (link) {
      link.addEventListener('click', function () {
        var combo = document.querySelector('.goog-te-combo');
        if (combo) {
          combo.value = link.getAttribute('data-lang');
          combo.dispatchEvent(new Event('change'));
        }
        window.location = link.getAttribute('href');
        location.reload();
      });
    });
  })();
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
